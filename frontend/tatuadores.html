
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Tatuadores</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="clientes.html">Estúdio de Tatuagem</a>

        <div class="navbar-nav">
            <a class="nav-link" href="clientes.html">Clientes</a>
            <a class="nav-link" href="senioridade.html">Senioridade</a>
            <a class="nav-link active" href="tatuadores.html">Tatuadores</a>
            <a class="nav-link" href="estilos.html">Estilos</a>
            <a class="nav-link me-3" href="agendamentos.html">Agendamentos</a>
<button onclick="sair()" class="btn btn-outline-light btn-sm">Sair</button>
        </div>
    </div>
</nav>

    <main class="container py-4">
        <h1 class="mb-4">Cadastro de Tatuadores</h1>

        <div class="card mb-4">
            <div class="card-header">Dados do tatuador</div>

            <div class="card-body">
                <form id="form-tatuador">
                    <input type="hidden" id="idtatuador">

                    <div class="mb-3">
                        <label for="nometatuador" class="form-label">Nome completo</label>
                        <input type="text" class="form-control"
                            id="nometatuador" required>
                    </div>

                    <div class="mb-3">
                        <label for="cpf" class="form-label">CPF</label>
                        <input type="text" class="form-control"
                            id="cpf" maxlength="14" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email">
                    </div>

                    <div class="mb-3">
                        <label for="telefone" class="form-label">Telefone</label>
                        <input type="text" class="form-control" id="telefone">
                    </div>

                    <div class="mb-3">
                        <label for="idsenioridade" class="form-label">Senioridade</label>
                        <select class="form-select" id="idsenioridade" required>
                            <option value="">Selecione a senioridade</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                    <label class="form-label">Estilos do tatuador</label>
                    <div id="lista-estilos" class="d-flex flex-wrap gap-3"></div>
                    </div>

                    <button type="submit" class="btn btn-primary"
                        id="btn-submit-tatuador">
                        Cadastrar
                    </button>

                    <button type="button" class="btn btn-secondary"
                        onclick="limparFormulario()">
                        Limpar
                    </button>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Tatuadores cadastrados</div>

            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>CPF</th>
                                <th>E-mail</th>
                                <th>Telefone</th>
                                <th>Senioridade</th>
                                <th>Estilos</th>
                                <th>Ações</th>
                            </tr>
                        </thead>

                        <tbody id="corpo-tabela"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/tatuadores.js"></script>
</body>
</html>
