<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Tatuadores</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        :root {
            --fundo: #0d0b12;
            --superficie: #17131f;
            --roxo: #9b5cff;
            --roxo-claro: #b88aff;
            --texto: #f5f2fa;
            --texto-secundario: #b5adbf;
            --borda: #332641;
        }

        * {
            box-sizing: border-box;
        }

        body {
        min-height: 100vh;
        margin: 0;
        background:
            radial-gradient(ellipse at 50% 0%, #48206b 0%, transparent 55%),
            linear-gradient(135deg, #160d20 0%, #0d0b12 60%, #21102e 100%) !important;
        color: var(--texto);
        font-family: "Segoe UI", Arial, sans-serif;
        }

        .navbar {
            background: rgba(13, 11, 18, 0.96) !important;
            border-bottom: 1px solid rgba(184, 138, 255, 0.18);
            padding: 14px 0;
        }

        .navbar-brand {
            font-weight: 750;
            letter-spacing: 0.2px;
        }

        .navbar-nav {
            align-items: center;
            gap: 4px;
        }

        .navbar-nav .nav-link {
            padding: 8px 12px !important;
            border-radius: 8px;
            color: var(--texto-secundario);
            transition: 0.2s ease;
        }

        .navbar-nav .nav-link:hover,
        .navbar-nav .nav-link.active {
            background: rgba(155, 92, 255, 0.12);
            color: var(--roxo-claro);
        }

        .btn {
            border-radius: 9px;
            font-weight: 650;
            transition: 0.2s ease;
        }

        .btn-outline-light {
            border-color: #514061;
            color: var(--texto);
        }

        .btn-outline-light:hover {
            background: #2a2037;
            border-color: var(--roxo);
            color: white;
        }

        main.container {
            padding-top: 38px !important;
            padding-bottom: 50px !important;
        }

        h1 {
            margin-bottom: 28px !important;
            font-size: clamp(2rem, 4vw, 2.7rem);
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(90deg, #ffffff, #c8a6ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .card {
            margin-bottom: 26px !important;
            overflow: hidden;
            border: 1px solid var(--borda);
            border-radius: 15px;
            background: rgba(23, 19, 31, 0.94);
            color: var(--texto);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.16);
        }

        .card-header {
            padding: 17px 22px;
            border-bottom: 1px solid var(--borda);
            background: #21172e;
            color: var(--roxo-claro);
            font-size: 1rem;
            font-weight: 700;
        }

        .card-body {
            padding: 24px;
        }

        .form-label {
            margin-bottom: 9px;
            color: var(--texto);
            font-weight: 600;
        }

        .form-control,
        .form-select {
            min-height: 46px;
            padding: 11px 14px;
            border: 1px solid #40334e;
            border-radius: 9px;
            background-color: #100d16;
            color: var(--texto);
        }

        .form-control::placeholder {
            color: #94899f;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--roxo);
            background-color: #100d16;
            color: var(--texto);
            box-shadow: 0 0 0 3px rgba(155, 92, 255, 0.15);
        }

        .form-select {
            color-scheme: dark;
        }

        .form-select option {
            background: #17131f;
            color: var(--texto);
        }

        #lista-estilos {
            padding: 14px;
            min-height: 48px;
            border: 1px solid var(--borda);
            border-radius: 10px;
            background: #100d16;
        }

        #lista-estilos .form-check {
            margin: 0;
            padding: 8px 12px 8px 34px;
            border: 1px solid #40334e;
            border-radius: 8px;
            background: #17131f;
        }

        #lista-estilos .form-check-input {
            background-color: #100d16;
            border-color: #665279;
        }

        #lista-estilos .form-check-input:checked {
            background-color: var(--roxo);
            border-color: var(--roxo);
        }

        #lista-estilos .form-check-input:focus {
            border-color: var(--roxo);
            box-shadow: 0 0 0 3px rgba(155, 92, 255, 0.15);
        }

        #lista-estilos .form-check-label {
            color: var(--texto);
        }

        .btn-primary {
            border: 1px solid transparent;
            background: linear-gradient(135deg, #9b5cff, #7535c7);
            color: white;
        }

        .btn-primary:hover {
            border-color: transparent;
            background: linear-gradient(135deg, #b080ff, #8b4be0);
            color: white;
            box-shadow: 0 6px 18px rgba(155, 92, 255, 0.2);
            transform: translateY(-1px);
        }

        .btn-secondary {
            border: 1px solid #514061;
            background: #292233;
            color: var(--texto);
        }

        .btn-secondary:hover {
            border-color: var(--roxo);
            background: #382747;
            color: white;
        }

        .table-responsive {
            border-radius: 8px;
        }

        .table {
            margin-bottom: 0;
            vertical-align: middle;
            --bs-table-color: var(--texto);
            --bs-table-bg: #17131f;
            --bs-table-border-color: var(--borda);
            --bs-table-striped-bg: #1d1727;
            --bs-table-striped-color: var(--texto);
            --bs-table-hover-bg: #292036;
            --bs-table-hover-color: white;
        }

        .table thead th {
            padding: 15px 12px;
            background: #21172e;
            color: var(--roxo-claro);
            font-weight: 700;
            white-space: nowrap;
        }

        .table tbody td {
            padding: 13px 12px;
            white-space: nowrap;
        }

        .table .btn {
            margin: 2px;
        }

        @media (max-width: 991px) {
            .navbar .container {
                align-items: flex-start;
                flex-direction: column;
            }

            .navbar-nav {
                flex-direction: row;
                flex-wrap: wrap;
                margin-top: 10px;
            }
        }

        @media (max-width: 576px) {
            main.container {
                padding-top: 25px !important;
            }

            .card-body {
                padding: 18px;
            }

            #lista-estilos {
                gap: 8px !important;
            }
        }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="clientes.html">Estúdio de Tatuagem</a>

        <div class="navbar-nav">
            <a class="nav-link" href="clientes.html">Clientes</a>
            <a class="nav-link" href="senioridade.html">Senioridade</a>
            <a class="nav-link active" href="tatuadores.html">Tatuadores</a>
            <a class="nav-link" href="estilos.html">Estilos</a>
            <a class="nav-link me-3" href="agendamentos.html">Agendamentos</a>
<button onclick="sair()" class="btn btn-outline-light btn-sm">Sair</button>
        </div>
    </div>
</nav>

    <main class="container py-4">
        <h1 class="mb-4">Cadastro de Tatuadores</h1>

        <div class="card mb-4">
            <div class="card-header">Dados do tatuador</div>

            <div class="card-body">
                <form id="form-tatuador">
                    <input type="hidden" id="idtatuador">

                    <div class="mb-3">
                        <label for="nometatuador" class="form-label">Nome completo</label>
                        <input type="text" class="form-control"
                            id="nometatuador" required>
                    </div>

                    <div class="mb-3">
                        <label for="cpf" class="form-label">CPF</label>
                        <input type="text" class="form-control"
                            id="cpf" maxlength="14" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email">
                    </div>

                    <div class="mb-3">
                        <label for="telefone" class="form-label">Telefone</label>
                        <input type="text" class="form-control" id="telefone">
                    </div>

                    <div class="mb-3">
                        <label for="idsenioridade" class="form-label">Senioridade</label>
                        <select class="form-select" id="idsenioridade" required>
                            <option value="">Selecione a senioridade</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                    <label class="form-label">Estilos do tatuador</label>
                    <div id="lista-estilos" class="d-flex flex-wrap gap-3"></div>
                    </div>

                    <button type="submit" class="btn btn-primary"
                        id="btn-submit-tatuador">
                        Cadastrar
                    </button>

                    <button type="button" class="btn btn-secondary"
                        onclick="limparFormulario()">
                        Limpar
                    </button>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Tatuadores cadastrados</div>

            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>CPF</th>
                                <th>E-mail</th>
                                <th>Telefone</th>
                                <th>Senioridade</th>
                                <th>Estilos</th>
                                <th>Ações</th>
                            </tr>
                        </thead>

                        <tbody id="corpo-tabela"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/tatuadores.js"></script>
</body>
</html>
