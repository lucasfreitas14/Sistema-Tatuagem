<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --fundo: #0d0b12;
      --superficie: #17131f;
      --roxo: #9b5cff;
      --roxo-claro: #b88aff;
      --texto: #f5f2fa;
      --texto-secundario: #b5adbf;
      --borda: #332641;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0 auto;
      padding: 30px 20px !important;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background:
        radial-gradient(ellipse at 50% 35%, #291641 0%, transparent 55%),
        var(--fundo);
      color: var(--texto);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    h1 {
      text-align: center;
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 32px !important;
      background: linear-gradient(90deg, #ffffff, #c8a6ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    #form-login {
      padding: 32px;
      background: rgba(23, 19, 31, 0.92);
      border: 1px solid var(--borda);
      border-radius: 18px;
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.3);
    }

    .form-control {
      min-height: 48px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #40334e;
      background: #100d16;
      color: var(--texto);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-control::placeholder {
      color: #94899f;
    }

    .form-control:focus {
      background: #100d16;
      color: var(--texto);
      border-color: var(--roxo);
      box-shadow: 0 0 0 3px rgba(155, 92, 255, 0.15);
    }

    .form-control:-webkit-autofill,
    .form-control:-webkit-autofill:hover,
    .form-control:-webkit-autofill:focus {
      -webkit-text-fill-color: var(--texto);
      -webkit-box-shadow: 0 0 0 1000px #100d16 inset;
      transition: background-color 9999s ease-in-out 0s;
    }

    .btn-primary {
      min-height: 48px;
      margin-top: 6px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: linear-gradient(135deg, #9b5cff, #7535c7);
      color: white;
      font-weight: 700;
      transition: 0.25s ease;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #b080ff, #8b4be0);
      color: white;
      box-shadow: 0 8px 25px rgba(155, 92, 255, 0.25);
      transform: translateY(-2px);
    }

    p.text-center {
      margin-top: 24px !important;
      color: var(--texto-secundario);
    }

    p a {
      color: var(--roxo-claro);
      font-weight: 650;
      text-decoration: none;
    }

    p a:hover {
      color: white;
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      #form-login {
        padding: 24px 20px;
      }

      h1 {
        font-size: 2.2rem;
      }
    }
  </style>
</head>
<body class="container py-5" style="max-width: 480px;">

  <h1 class="mb-4">Entrar</h1>

  <form id="form-login">
    <div class="mb-3">
      <input type="email" id="email" class="form-control" placeholder="E-mail" required>
    </div>

    <div class="mb-3">
      <input type="password" id="senha" class="form-control" placeholder="Senha" required>
    </div>

    <button type="submit" class="btn btn-primary w-100">Entrar</button>
  </form>

  <p class="mt-3 text-center">
    Não tem conta? <a href="cadastro.html">Cadastre-se</a>
  </p>

  <script src="js/login.js"></script>

</body>
</html>
