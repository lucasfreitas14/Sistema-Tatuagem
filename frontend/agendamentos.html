<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamentos — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --fundo: #0d0b12;
      --superficie: #17131f;
      --roxo: #9b5cff;
      --roxo-claro: #b88aff;
      --texto: #f5f2fa;
      --texto-secundario: #b5adbf;
      --borda: #332641;
    }

    * {
      box-sizing: border-box;
    }

    body {
    min-height: 100vh;
    margin: 0;
    background:
        radial-gradient(ellipse at 50% 0%, #48206b 0%, transparent 55%),
        linear-gradient(135deg, #160d20 0%, #0d0b12 60%, #21102e 100%) !important;
    color: var(--texto);
    font-family: "Segoe UI", Arial, sans-serif;
    }

    .navbar {
      background: rgba(13, 11, 18, 0.96) !important;
      border-bottom: 1px solid rgba(184, 138, 255, 0.18);
      padding: 14px 0;
    }

    .navbar-brand {
      font-weight: 750;
      letter-spacing: 0.2px;
    }

    .navbar-nav {
      align-items: center;
      gap: 4px;
    }

    .navbar-nav .nav-link {
      padding: 8px 12px !important;
      border-radius: 8px;
      color: var(--texto-secundario);
      transition: 0.2s ease;
    }

    .navbar-nav .nav-link:hover,
    .navbar-nav .nav-link.active {
      background: rgba(155, 92, 255, 0.12);
      color: var(--roxo-claro);
    }

    .btn {
      border-radius: 9px;
      font-weight: 650;
      transition: 0.2s ease;
    }

    .btn-outline-light {
      border-color: #514061;
      color: var(--texto);
    }

    .btn-outline-light:hover {
      background: #2a2037;
      border-color: var(--roxo);
      color: white;
    }

    main.container {
      padding-top: 38px !important;
      padding-bottom: 50px !important;
    }

    h1 {
      margin-bottom: 28px;
      font-size: clamp(2rem, 4vw, 2.7rem);
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(90deg, #ffffff, #c8a6ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    #form-agendamento {
      padding: 22px;
      margin-bottom: 30px !important;
      border: 1px solid var(--borda);
      border-radius: 15px;
      background: rgba(23, 19, 31, 0.92);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.16);
    }

    .form-control,
    .form-select {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid #40334e;
      border-radius: 9px;
      background-color: #100d16;
      color: var(--texto);
    }

    .form-control::placeholder {
      color: #94899f;
      opacity: 1;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: var(--roxo);
      background-color: #100d16;
      color: var(--texto);
      box-shadow: 0 0 0 3px rgba(155, 92, 255, 0.15);
    }

    .form-select option {
      background: #17131f;
      color: var(--texto);
    }

    input[type="date"],
    input[type="time"] {
      color-scheme: dark;
    }

    input[type="file"] {
      padding: 7px;
      font-size: 0.9rem;
    }

    input[type="file"]::file-selector-button {
      margin-right: 10px;
      padding: 6px 10px;
      border: 0;
      border-radius: 6px;
      background: #30213f;
      color: var(--roxo-claro);
      cursor: pointer;
    }

    input[type="file"]::file-selector-button:hover {
      background: #413052;
    }

    textarea.form-control {
      min-height: 90px;
      resize: vertical;
    }

    .form-label {
      margin-bottom: 8px;
      color: var(--texto);
      font-weight: 600;
    }

    .btn-primary {
      border: 1px solid transparent;
      background: linear-gradient(135deg, #9b5cff, #7535c7);
      color: white;
    }

    .btn-primary:hover {
      border-color: transparent;
      background: linear-gradient(135deg, #b080ff, #8b4be0);
      color: white;
      box-shadow: 0 6px 18px rgba(155, 92, 255, 0.2);
      transform: translateY(-1px);
    }

    .table {
      margin-top: 10px;
      vertical-align: middle;
      --bs-table-color: var(--texto);
      --bs-table-bg: rgba(23, 19, 31, 0.92);
      --bs-table-border-color: var(--borda);
      --bs-table-striped-bg: #1d1727;
      --bs-table-striped-color: var(--texto);
      --bs-table-hover-bg: #292036;
      --bs-table-hover-color: white;
    }

    .table thead th {
      padding: 15px 12px;
      background: #21172e;
      color: var(--roxo-claro);
      font-weight: 700;
      white-space: nowrap;
    }

    .table tbody td {
      padding: 13px 12px;
    }

    .table .btn {
      margin: 2px;
    }

    @media (max-width: 991px) {
      .navbar .container {
        align-items: flex-start;
        flex-direction: column;
      }

      .navbar-nav {
        flex-direction: row;
        flex-wrap: wrap;
        margin-top: 10px;
      }
    }

    @media (max-width: 767px) {
      main.container {
        padding-top: 25px !important;
      }

      #form-agendamento {
        padding: 16px;
      }

      main.container > .table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
      }
    }
  </style>
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="clientes.html">Estúdio de Tatuagem</a>

        <div class="navbar-nav">
            <a class="nav-link" href="clientes.html">Clientes</a>
            <a class="nav-link" href="senioridade.html">Senioridade</a>
            <a class="nav-link" href="tatuadores.html">Tatuadores</a>
            <a class="nav-link" href="estilos.html">Estilos</a>
            <a class="nav-link me-3" href="agendamentos.html">Agendamentos</a>
            <button onclick="sair()" class="btn btn-outline-light btn-sm">Sair</button>
        </div>
    </div>
</nav> 

<main class="container py-4">

  <h1>Agendamentos</h1>

  <form id="form-agendamento" class="row g-2 mt-2 mb-4">
    <div class="col-md-3">
      <select id="idcliente" class="form-select" required>
        <option value="">Cliente...</option>
      </select>
    </div>

    <div class="col-md-3">
      <select id="idtatuador" class="form-select" required>
        <option value="">Tatuador...</option>
      </select>
    </div>

    <div class="col-md-2">
      <input type="date" id="dataagendamento" class="form-control" required>
    </div>

    <div class="col-md-2">
      <input type="time" id="horaagendamento" class="form-control" required>
    </div>

    <div class="col-md-2">
      <input type="number" id="valortatuagem" class="form-control"
             placeholder="Valor (R$)" step="0.01" min="0">
    </div>

    <div class="col-md-12">
      <textarea id="descricaotatuagem" class="form-control"
                placeholder="Descrição da tatuagem"></textarea>
    </div>

    <div class="col-md-4">
    <label class="form-label">Desenho aprovado (imagem)</label>
    <input type="file" id="desenho" class="form-control" accept="image/*">
    </div>

    <div class="col-md-3" id="bloco-status" style="display: none;">
      <select id="status" class="form-select">
        <option value="pendente">Pendente</option>
        <option value="confirmado">Confirmado</option>
        <option value="concluido">Concluído</option>
        <option value="cancelado">Cancelado</option>
      </select>
    </div>

    <div class="col-md-2">
      <button id="btn-submit-agendamento" type="submit"
              class="btn btn-primary w-100">Cadastrar</button>
    </div>
  </form>

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>ID</th>
        <th>Cliente</th>
        <th>Tatuador</th>
        <th>Data</th>
        <th>Hora</th>
        <th>Valor</th>
        <th>Status</th>
        <th>Desenho</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="corpo-tabela"></tbody>
  </table>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/agendamentos.js"></script>
</body>
</html>
