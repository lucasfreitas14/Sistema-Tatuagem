<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --fundo: #0d0b12;
      --superficie: #17131f;
      --roxo: #9b5cff;
      --roxo-claro: #b88aff;
      --texto: #f5f2fa;
      --texto-secundario: #b5adbf;
      --borda: #332641;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 50% 0%, #291641 0%, transparent 48%),
        var(--fundo);
      color: var(--texto);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .navbar {
      background: rgba(13, 11, 18, 0.9) !important;
      border-bottom: 1px solid rgba(184, 138, 255, 0.18);
      padding: 18px 0;
      backdrop-filter: blur(12px);
    }

    .navbar-brand {
      font-size: 1.2rem;
      font-weight: 750;
      letter-spacing: 0.3px;
    }

    .btn {
      border-radius: 10px;
      font-weight: 650;
      transition: 0.25s ease;
    }

    .btn-outline-light {
      border-color: #514061;
      color: var(--texto);
    }

    .btn-outline-light:hover {
      background: #2a2037;
      border-color: var(--roxo);
      color: white;
    }

    .container > h1 {
      margin-top: 42px;
      margin-bottom: 30px !important;
      font-size: clamp(2rem, 4vw, 2.7rem);
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(90deg, #ffffff, #c8a6ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .row {
      padding-bottom: 50px;
    }

    .row > div {
      display: flex;
    }

    .row .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 110px;
      padding: 24px !important;
      border: 1px solid var(--borda);
      border-radius: 15px;
      background: var(--superficie);
      color: var(--texto);
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    .row .btn-primary {
      border-color: rgba(155, 92, 255, 0.35);
      background: linear-gradient(145deg, #21172e, #17131f);
    }

    .row .btn-secondary {
      border-color: #393043;
      background: linear-gradient(145deg, #1c1823, #17131f);
    }

    .row .btn:hover {
      border-color: var(--roxo);
      background: linear-gradient(145deg, #302044, #1c1527);
      color: white;
      box-shadow: 0 12px 30px rgba(155, 92, 255, 0.14);
      transform: translateY(-4px);
    }

    @media (max-width: 767px) {
      .container > h1 {
        margin-top: 30px;
      }

      .row .btn {
        min-height: 85px;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand">Estúdio de Tatuagem</span>
      <button onclick="sair()" class="btn btn-outline-light btn-sm">Sair</button>
    </div>
  </nav>

  <div class="container">
    <h1 class="mb-4">Painel</h1>

    <div class="row g-3">
      <div class="col-md-4">
        <a href="clientes.html" class="btn btn-primary w-100 py-3">Clientes</a>
      </div>

      <div class="col-md-4">
        <a href="tatuadores.html" class="btn btn-primary w-100 py-3">Tatuadores</a>
      </div>

      <div class="col-md-4">
        <a href="agendamentos.html" class="btn btn-primary w-100 py-3">Agendamentos</a>
      </div>

      <div class="col-md-4">
        <a href="senioridade.html" class="btn btn-secondary w-100 py-3">Senioridade</a>
      </div>

      <div class="col-md-4">
        <a href="estilos.html" class="btn btn-secondary w-100 py-3">Estilos</a>
      </div>

      <div class="col-md-4">
        <a href="cadastro.html" class="btn btn-secondary w-100 py-3">Novo Funcionário</a>
    </div>

    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    protegerPagina()
  </script>

</body>
</html>
